[workspace]
resolver = "2"
members = ["crates/oj-protocol", "crates/oj-bridge", "crates/oj-testkit", "crates/oj-journal", "crates/oj-savefile", "crates/oj-gamedata", "app/src-tauri"]

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

# Lints every crate shares (each opts in with `[lints] workspace = true`); CI runs clippy with warnings as errors.
[workspace.lints.clippy]
# `as_chunks` needs Rust 1.88, newer than rust-version above.
chunks_exact_to_as_chunks = "allow"
# The bridge's events and trait objects are clearer as they are than boxed or aliased.
large_enum_variant = "allow"
type_complexity = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"

# Decoding the game's map pictures is slow unoptimised (seconds per picture); optimise the decoders in dev builds too.
[profile.dev.package.oj-gamedata]
opt-level = 3
[profile.dev.package."*"]
opt-level = 2
