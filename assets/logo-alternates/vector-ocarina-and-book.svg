<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="leather" cx=".35" cy=".25" r=".9">
      <stop offset="0" stop-color="#4a3220"/>
      <stop offset=".6" stop-color="#2a1b10"/>
      <stop offset="1" stop-color="#160e08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc8e"/>
      <stop offset=".5" stop-color="#d9b25f"/>
      <stop offset="1" stop-color="#9c7330"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c9cf0"/>
      <stop offset=".45" stop-color="#3466c4"/>
      <stop offset="1" stop-color="#1b3f8c"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d939c"/>
      <stop offset=".45" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#7b818a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3dc"/>
      <stop offset="1" stop-color="#e8d6aa"/>
    </linearGradient>
  </defs>

  <!-- badge: dark leather, gold rim -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#leather)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <rect x="38" y="38" width="436" height="436" rx="88" fill="none" stroke="#d9b25f" stroke-opacity=".35" stroke-width="2.5"/>

  <!-- the journal: an open book, pages fanning from the spine -->
  <g transform="translate(256 388)">
    <path d="M-176 -8 C-120 -34 -50 -34 0 -6 C50 -34 120 -34 176 -8 L176 46 C120 22 50 22 0 50 C-50 22 -120 22 -176 46 Z" fill="#6b4523"/>
    <path d="M-166 -20 C-112 -46 -46 -44 0 -16 L0 36 C-46 10 -112 8 -166 34 Z" fill="url(#page)"/>
    <path d="M166 -20 C112 -46 46 -44 0 -16 L0 36 C46 10 112 8 166 34 Z" fill="url(#page)"/>
    <path d="M0 -16 L0 36" stroke="#b8975c" stroke-width="3"/>
    <!-- a gold ribbon bookmark -->
    <path d="M96 22 L96 92 L112 78 L128 92 L128 18" fill="#d9b25f" stroke="#8a6427" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- the ocarina, seen from above at an angle: tapered end left, mouthpiece rising from the round end -->
  <g transform="translate(250 236) rotate(-18)">
    <ellipse cx="0" cy="78" rx="150" ry="22" fill="#000" opacity=".28"/>
    <path d="M-168 30 C-130 -24 -10 -62 92 -56 C176 -50 196 22 150 54 C104 86 -40 88 -130 64 C-170 54 -184 46 -168 30 Z" fill="url(#glaze)" stroke="#0f285e" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-140 26 C-100 -16 0 -44 88 -40 C120 -38 138 -30 148 -18 C110 -30 10 -28 -60 0 C-96 14 -124 28 -140 26 Z" fill="#a9c6ff" opacity=".45"/>
    <!-- mouthpiece -->
    <path d="M96 -48 L104 -112 L146 -108 L140 -42 Z" fill="url(#glaze)" stroke="#0f285e" stroke-width="7" stroke-linejoin="round"/>
    <rect x="98" y="-132" width="54" height="26" rx="8" transform="rotate(4 125 -119)" fill="url(#silver)" stroke="#4b525c" stroke-width="5"/>
    <!-- finger holes on the top -->
    <g fill="#0b1a3d" stroke="#d6e4ff" stroke-width="3.5">
      <ellipse cx="-92" cy="14" rx="13" ry="10"/>
      <ellipse cx="-42" cy="-10" rx="14" ry="11"/>
      <ellipse cx="14" cy="-24" rx="15" ry="11"/>
      <ellipse cx="68" cy="-26" rx="15" ry="11"/>
      <ellipse cx="-20" cy="32" rx="14" ry="10"/>
      <ellipse cx="44" cy="22" rx="15" ry="11"/>
    </g>
  </g>

  <!-- two beamed notes rising from it -->
  <g fill="#f3e6c8">
    <ellipse cx="100" cy="158" rx="18" ry="13" transform="rotate(-22 100 158)"/>
    <ellipse cx="170" cy="138" rx="18" ry="13" transform="rotate(-22 170 138)"/>
    <rect x="111" y="84" width="7" height="72" rx="3"/>
    <rect x="181" y="64" width="7" height="72" rx="3"/>
    <path d="M111 84 L188 64 L188 82 L111 102 Z"/>
  </g>
</svg>
