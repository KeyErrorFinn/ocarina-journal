# Weekly pull requests to update dependencies, grouped so they arrive as a few reviewable pull requests.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    groups:
      app: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
