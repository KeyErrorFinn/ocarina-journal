[package]
name = "ocarina-journal"
description = "Ocarina Journal: unofficial read-only companion for Longshot"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ocarina_journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
oj-protocol = { path = "../../crates/oj-protocol" }
oj-bridge = { path = "../../crates/oj-bridge" }
oj-journal = { path = "../../crates/oj-journal" }
oj-savefile = { path = "../../crates/oj-savefile" }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
